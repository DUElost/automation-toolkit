version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: jira_automation
      POSTGRES_USER: jira_user
      POSTGRES_PASSWORD: jira_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_user -d jira_automation"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 应用服务
  app:
    build: .
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jira_automation
      - DB_USER=jira_user
      - DB_PASSWORD=jira_password
      - DB_TYPE=postgresql
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./Result_VFFBA_V551A_dai.lv_MonkeyAEE_DCC_20250808.xls:/app/data/sample.xls
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "src/main.py", "--excel", "/app/data/sample.xls", "--action", "process", "--log-level", "INFO"]

volumes:
  postgres_data: