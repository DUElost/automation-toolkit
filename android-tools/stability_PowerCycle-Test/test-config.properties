# 开关机测试运行配置（deploy/run 脚本读取）

# 循环次数
test.times=100

# 模式: reboot（软重启）| poweroff（真关机+闹钟唤醒，需平台支持）
test.mode=reboot

# 真关机后等待开机时间（分钟），仅 poweroff 模式有效
power.off.minutes=1

# 每次开机后、执行关机/重启前的等待秒数
wait.seconds=3

# 测试员
tester.name=tester

# deploy 后是否自动开跑
auto.start=true

# 开机自动续跑 + 看门狗
auto.resume=true

# 后端: auto（Z2582 无 REBOOT 时自动用 MSSV）| mssv | autotesttool
backend=auto

# MSSV APK 路径（Z2582 首次部署未预装时填写）
mssv.apk.path=D:\BaiduNetdiskDownload\105458__Mssv_A16_260723\Mssv_A16V1_250520.apk
