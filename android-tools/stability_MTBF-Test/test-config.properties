# MTBF 离线测试运行配置（deploy/run 脚本读取）
# 修改后运行 scripts\deploy.bat 或 scripts\run.bat

# 整套任务循环次数（对应 runtask.xml 的 times 属性）
# 单轮约 6~8 小时；7 天连续老化建议 >= 50（约 300~400 小时余量）
# 设为 0 表示不覆盖 config/runtask.xml 中的 times
task.times=100

# 计划连续运行天数（仅文档/脚本提示用）
run.duration.days=7

# 测试员姓名（写入 OfflineScriptManager）
tester.name=tester

# deploy 完成后是否自动启动任务
auto.start=true

# 是否启用设备端自动续跑（开机恢复 + 30 分钟看门狗）
auto.resume=true
