# PowerCycleManager (ATTS) 构建配置
# 修改后运行 build-powercycle-apk.bat

# ATTS 工程路径（方案 A 基于 D:\Tinno_auto\ATTS）
atts.project.dir=D:\Tinno_auto\ATTS

# Gradle 使用的 JDK（AGP 8.5 需要 Java 11+，留空则自动探测 Android Studio jbr）
# 示例: D:\Program Files\Android\Android Studio\jbr
java.home=

# Gradle 变体: debug | release
build.variant=debug

# 目标 ABI（split APK 时选用）
target.abi=arm64-v8a

# 签名模式: debug | platform
sign.mode=platform

# TINNO 平台签名密钥（与设备 system 分区证书匹配）
platform.pk8=C:\Users\Rin\ReliabilityUiautomatorTest_X6851\sign\platform.pk8
platform.x509.pem=C:\Users\Rin\ReliabilityUiautomatorTest_X6851\sign\platform.x509.pem

# 输出版本
version.name=1.2.0-powercycle
version.code=10210
