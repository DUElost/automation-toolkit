# OfflineScriptManager 构建配置
# 修改后运行 build-offline-apk.bat 即可重新打包

# App 有效期截止时间（格式: yyyy-MM-dd HH:mm:ss）
# 必须与下方 Java 源码中的 EXPIRY_DATE 保持一致
expiry.date=2099-12-31 23:59:59

# 是否跳过过期检查（true=永不弹过期窗，false=按 expiry.date 校验）
disable.expiry.check=false

# 是否移除 android:sharedUserId（系统签名安装必须为 false）
remove.shared.user.id=false

# 签名模式: debug | platform
sign.mode=platform

# TINNO 平台签名密钥（与设备 system 分区证书匹配）
platform.pk8=C:\Users\Rin\ReliabilityUiautomatorTest_X6851\sign\platform.pk8
platform.x509.pem=C:\Users\Rin\ReliabilityUiautomatorTest_X6851\sign\platform.x509.pem

# 输出 APK 版本号（便于区分自编译版本）
version.name=1.2.2-system
version.code=10206
